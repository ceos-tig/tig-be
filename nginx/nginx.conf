user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 블루와 그린 환경 정의
    upstream blue_backend {
        server app-blue:8081; # 블루 환경 포트
        keepalive 32;
    }

    upstream green_backend {
        server app-green:8082; # 그린 환경 포트
        keepalive 32;
    }

    server {
        listen 80;

        # 공통 URL (api.tigleisure.com)
        server_name api.tigleisure.com;

        location / {
            # 현재 활성화된 환경으로 라우팅 (green_backend 또는 blue_backend)
            proxy_pass http://green_backend; # 초기에는 그린 환경으로 설정
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # CORS 설정 추가
            add_header 'Access-Control-Allow-Origin' 'https://tigleisure.com' always;
            add_header 'Access-Control-Allow-Credentials' 'true';

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://tigleisure.com';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, PATCH, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                add_header 'Access-Control-Allow-Credentials' 'true';
                return 204;
            }
        }

        # Health Check
        location /tig/health {
            proxy_pass http://green_backend/tig/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /deploy/status {
            proxy_pass http://green_backend/deploy/status; # 활성화된 환경에 대한 요청 처리
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # CORS 설정 추가
            add_header 'Access-Control-Allow-Origin' 'https://tigleisure.com' always;
            add_header 'Access-Control-Allow-Credentials' 'true';

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://tigleisure.com';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, DELETE, PATCH, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
                add_header 'Access-Control-Allow-Credentials' 'true';
                return 204;
            }
        }
    }
}