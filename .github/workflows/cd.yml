name: CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Java 버전 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v2

      # 2. Gradle Wrapper 권한 설정
      - name: Set Gradle permissions
        run: chmod +x server/gradlew

      # 3. Gradle 빌드 실행
      - name: Build with Gradle
        working-directory: server
        run: ./gradlew clean build

      # 4. .env 파일 생성
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 5. Docker Compose 설치
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      # 6. Docker 로그인
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 7. Docker 빌드 및 푸시
      - name: Build and push Docker image
        run: |
          docker-compose build
          
          docker push nimikgnoej/tig-web:blue
          docker push nimikgnoej/tig-web:green
          docker push nimikgnoej/tig-nginx

      # 1. Secrets에서 .pem 파일 생성
      - name: Create .pem file from secret
        run: echo "${{ secrets.SERVER_SSH_KEY }}" > tig-key-pair.pem

      # 2. .pem 파일 권한 설정
      - name: Set permission for .pem file
        run: chmod 600 tig-key-pair.pem

      # 3. Add EC2 host to known_hosts
      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 4. EC2에 docker-compose.yml 및 nginx.conf 전송
      - name: Copy configuration files to EC2
        run: |
          scp -i tig-key-pair.pem ${{ github.workspace }}/docker-compose.yml ubuntu@${{ secrets.SERVER_IP }}:~
          scp -i tig-key-pair.pem ${{ github.workspace }}/nginx/nginx.conf ubuntu@${{ secrets.SERVER_IP }}:~

      # 9. 블루/그린 배포를 위한 스크립트 실행
      - name: SSH to EC2 and run deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Nginx 설정 적용
            echo "Updating Nginx configuration"
            sudo mv ~/nginx.conf /etc/nginx/nginx.conf
            sudo nginx -s reload

            # 블루 환경 설정 (개발/테스트)
            echo "Setting up Blue environment (Development/Test)"
            docker-compose -f docker-compose.yml up -d blue

            # 블루 환경 Health Check
            echo "Checking Blue environment health"
            until [ "$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8081/tig/health)" == "200" ]; do
              echo "Waiting for Blue environment to be healthy..."
              sleep 5
            done
            echo "Blue environment is healthy!"

            # 그린 환경 설정 (운영)
            echo "Setting up Green environment (Production)"
            docker-compose -f docker-compose.yml up -d green

            # 그린 환경 Health Check
            echo "Checking Green environment health"
            until [ "$(curl -s -o /dev/null -w ''%{http_code}'' http://localhost:8082/tig/health)" == "200" ]; do
              echo "Waiting for Green environment to be healthy..."
              sleep 5
            done
            echo "Green environment is healthy!"