name: CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Java 버전 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v2

      # 2. Gradle Wrapper 권한 설정
      - name: Set Gradle permissions
        run: chmod +x server/gradlew

      # 3. Gradle 빌드 실행
      - name: Build with Gradle
        working-directory: server
        run: ./gradlew clean build

      # 4. Docker Compose 설치
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      # 5. Docker 로그인
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 6. 기존 이미지 삭제
      - name: Remove existing Docker images
        run: |
          docker rmi nimikgnoej/tig-web:blue || true
          docker rmi nimikgnoej/tig-web:green || true
          docker rmi nimikgnoej/tig-nginx:latest || true

      # 8. Secrets에서 .pem 파일 생성
      - name: Create .pem file from secret
        run: echo "${{ secrets.SERVER_SSH_KEY }}" > tig-key-pair.pem

      # 9. .pem 파일 권한 설정
      - name: Set permission for .pem file
        run: chmod 600 tig-key-pair.pem

      # 10. Add EC2 host to known_hosts
      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 11. 동적으로 .env 파일 생성 및 전송
      - name: Set active environment in .env and copy to EC2
        run: |
          # 기존 secrets.ENV_FILE 내용 저장
          echo "${{ secrets.ENV_FILE }}" > .env

          # 현재 활성화된 환경 가져오기
          ACTIVE_ENV=$(ssh -i tig-key-pair.pem ubuntu@${{ secrets.SERVER_IP }} \ 
            "curl -fs http://localhost/deploy/status | jq -r '.environment'" || echo "green")

          echo "Current active environment: $ACTIVE_ENV"

          # 환경 변수 추가
          if [ "$ACTIVE_ENV" = "green" ]; then
            echo "environment=blue" >> .env # 현재 green이면 다음 환경은 blue
          else
            echo "environment=green" >> .env # 현재 blue이면 다음 환경은 green
          fi

          # EC2에 전송
          scp -i tig-key-pair.pem .env ubuntu@${{ secrets.SERVER_IP }}:~

      # 7. Docker 빌드 및 푸시
      - name: Build and push Docker image
        run: |
          docker-compose build
          
          docker push nimikgnoej/tig-web:blue
          docker push nimikgnoej/tig-web:green
          docker push nimikgnoej/tig-nginx

      # 12. EC2에 docker-compose.yml 전송
      - name: Copy docker-compose.yml to EC2
        run: scp -i tig-key-pair.pem ${{ github.workspace }}/docker-compose.yml ubuntu@${{ secrets.SERVER_IP }}:~

      # 13. EC2에 nginx.conf.template 전송
      - name: Copy nginx.conf.template to EC2
        run: scp -i tig-key-pair.pem ${{ github.workspace }}/nginx/nginx.conf.template ubuntu@${{ secrets.SERVER_IP }}:/home/ubuntu/nginx.conf.template

      # 14. 블루/그린 배포 스크립트 실행
      - name: SSH to EC2 and run deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 현재 활성화된 환경 확인
            IS_GREEN=$(docker ps | grep app-green)
            IS_BLUE=$(docker ps | grep app-blue)
            
            if [ -z "$IS_GREEN" ] && [ -z "$IS_BLUE" ]; then
              echo "No active environment detected. Starting fresh deployment with GREEN environment."
            
              echo "ENVSUBST start"
              source /home/ubuntu/.env
            
              # .env 파일을 읽고 export
              export environment=$(grep environment /home/ubuntu/.env | cut -d '=' -f2)
              
              # 환경 변수 확인
              echo "current env's environment value : $environment"
              envsubst '$environment' < /home/ubuntu/nginx.conf.template > /home/ubuntu/nginx.conf
              
            
              # 그린 환경으로 초기화
              docker-compose pull green
              docker-compose up -d green

              # Health Check
              echo "Performing health check for GREEN"
              MAX_RETRIES=10
              RETRY_COUNT=0
              until [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/tig/health)" == "200" ]; do
                echo "Waiting for GREEN environment to be healthy..."
                sleep 5
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
                  echo "Health check for GREEN environment failed after $MAX_RETRIES retries."
                  exit 1
                fi
              done
              echo "GREEN environment is healthy. Deployment completed."
            
              # docker-compose.yml에 이미 nginx.conf가 볼륨으로 연결되어 있어야 함
              echo "Applying Nginx configuration..."
              docker-compose pull nginx
              docker-compose up -d nginx
            
              # Nginx 설정 검증 및 재적용
              docker exec nginx nginx -t
              docker exec nginx nginx -s reload
              
              docker exec nginx nginx -t
              docker exec nginx nginx -s reload
              echo "Removing unused images..."
              docker image prune -f
            
              exit 0
            fi  

            if [ -n "$IS_GREEN" ]; then
              echo "Currently running GREEN environment. Switching to BLUE."
            
              # 테스트 환경 test-blue 종료
              if [ "$(docker ps | grep test-blue)" ]; then
                echo "Stopping and removing test-blue environment..."
                docker stop test-blue
                docker rm test-blue
              fi
              
              echo "ENVSUBST start"
              source /home/ubuntu/.env
            
              # .env 파일을 읽고 export
              export environment=$(grep environment /home/ubuntu/.env | cut -d '=' -f2)
            
              # 환경 변수 확인
              echo "current env's environment value : $environment"
              envsubst '$environment' < /home/ubuntu/nginx.conf.template > /home/ubuntu/nginx.conf
              
            
              # 블루 환경 준비
              docker-compose pull blue
              docker-compose up -d blue

              # Health Check
              echo "Performing health check for BLUE"
              MAX_RETRIES=10
              RETRY_COUNT=0
              until [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/tig/health)" == "200" ]; do
                echo "Waiting for BLUE environment to be healthy..."
                sleep 5
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
                  echo "Health check for BLUE environment failed after $MAX_RETRIES retries."
                  exit 1
                fi
              done

              echo "Deployment to BLUE is successful."
            
              # docker-compose.yml에 이미 nginx.conf가 볼륨으로 연결되어 있어야 함
              echo "Applying Nginx configuration..."
              docker-compose pull nginx
              docker-compose up -d nginx
              
              # Nginx 설정 검증 및 재적용
              docker exec nginx nginx -t
              docker exec nginx nginx -s reload
            

              # 그린 환경 정리
              echo "Cleaning up GREEN environment"
              docker stop app-green
              docker rm -f app-green
              docker rmi nimikgnoej/tig-web:green || true
            
              # test-green 배포
              echo "Starting test-green environment for testing..."
              docker pull nimikgnoej/tig-web:green
              docker run -d -p 8082:8080 --env-file ./.env --name test-green nimikgnoej/tig-web:green
              docker network connect ubuntu_app-network test-green
            
              echo "Removing unused images..."
              docker image prune -f
            
            elif [ -n "$IS_BLUE" ]; then
              echo "Currently running BLUE environment. Switching to GREEN."
            
              # 테스트 환경 test-green 종료
              if [ "$(docker ps | grep test-green)" ]; then
                echo "Stopping and removing test-green environment..."
                docker stop test-green
                docker rm test-green
              fi
            
              echo "ENVSUBST start"
              source /home/ubuntu/.env
            
              # .env 파일을 읽고 export
              export environment=$(grep environment /home/ubuntu/.env | cut -d '=' -f2)
            
              # 환경 변수 확인
              echo "current env's environment value : $environment"
              envsubst '$environment' < /home/ubuntu/nginx.conf.template > /home/ubuntu/nginx.conf
              
            
              # 그린 환경 준비
              docker-compose pull green
              docker-compose up -d green
            
              # Health Check
              echo "Performing health check for GREEN"
              MAX_RETRIES=10
              RETRY_COUNT=0
              until [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/tig/health)" == "200" ]; do
                echo "Waiting for GREEN environment to be healthy..."
                sleep 5
                RETRY_COUNT=$((RETRY_COUNT + 1))
                if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
                  echo "Health check for GREEN environment failed after $MAX_RETRIES retries."
                  exit 1
                fi
              done
            
              echo "Deployment to GREEN is successful."
              # docker-compose.yml에 이미 nginx.conf가 볼륨으로 연결되어 있어야 함
              echo "Applying Nginx configuration..."
              docker-compose pull nginx
              docker-compose up -d nginx
            
              # Nginx 설정 검증 및 재적용
              docker exec nginx nginx -t
              docker exec nginx nginx -s reload

              # 블루 환경 정리
              echo "Cleaning up BLUE environment"
              docker stop app-blue
              docker rm -f app-blue
              docker rmi nimikgnoej/tig-web:blue || true
              
              # test-blue 배포
              echo "Starting test-blue environment for testing..."
              docker pull nimikgnoej/tig-web:blue
              docker run -d -p 8081:8080 --env-file ./.env --name test-blue nimikgnoej/tig-web:blue
              docker network connect ubuntu_app-network test-blue
            
              echo "Removing unused images..."
              docker image prune -f
            fi