name: CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Java 버전 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      # 1. 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v2

      # 2. Gradle Wrapper 권한 설정
      - name: Set Gradle permissions
        run: chmod +x server/gradlew

      # 3. Gradle 빌드 실행
      - name: Build with Gradle
        working-directory: server
        run: ./gradlew clean build

      # 4. .env 파일 생성
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 5. Docker Compose 설치
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      # 6. Docker 로그인
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 7. Docker 빌드 및 푸시
      - name: Build and push Docker image
        run: |
          docker-compose build
          
          docker push nimikgnoej/tig-web
          docker push nimikgnoej/tig-nginx

      # 8. 원격 서버에 배포
      - name: SSH to EC2 and run deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker ps -a -q | xargs -r docker rm --force
            docker images -q | xargs -r docker rmi --force
            
            docker pull nimikgnoej/tig-web
            docker pull nimikgnoej/tig-nginx
            
            docker-compose down
            docker-compose up -d