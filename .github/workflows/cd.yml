name: CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Java 버전 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v2

      # 2. Gradle Wrapper 권한 설정
      - name: Set Gradle permissions
        run: chmod +x server/gradlew

      # 3. Gradle 빌드 실행
      - name: Build with Gradle
        working-directory: server
        run: ./gradlew clean build

      # 4. .env 파일 생성
      - name: Create .env file
        run: |
          echo "${{ secrets.ENV_FILE }}" > .env

      # 5. Docker Compose 설치
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      # 6. Docker 로그인
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # 7. 기존 이미지 삭제
      - name: Remove existing Docker images
        run: |
          docker rmi nimikgnoej/tig-web:blue || true
          docker rmi nimikgnoej/tig-web:green || true
          docker rmi nimikgnoej/tig-nginx:latest || true

      # 8. Docker 빌드 및 푸시
      - name: Build and push Docker image
        run: |
          docker-compose build
          
          docker push nimikgnoej/tig-web:blue
          docker push nimikgnoej/tig-web:green
          docker push nimikgnoej/tig-nginx

      # 9. Secrets에서 .pem 파일 생성
      - name: Create .pem file from secret
        run: echo "${{ secrets.SERVER_SSH_KEY }}" > tig-key-pair.pem

      # 10. .pem 파일 권한 설정
      - name: Set permission for .pem file
        run: chmod 600 tig-key-pair.pem

      # 11. Add EC2 host to known_hosts
      - name: Add EC2 host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      # 12. EC2에 docker-compose.yml 전송
      - name: Copy docker-compose.yml to EC2
        run: scp -i tig-key-pair.pem ${{ github.workspace }}/docker-compose.yml ubuntu@${{ secrets.SERVER_IP }}:~

      # 13. EC2에 nginx.conf 전송
      - name: Copy nginx.conf to EC2
        run: scp -i tig-key-pair.pem ${{ github.workspace }}/nginx/nginx.conf ubuntu@${{ secrets.SERVER_IP }}:/home/ubuntu/nginx.conf

      # 14. 블루/그린 배포 스크립트 실행
      - name: SSH to EC2 and run deployment
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 현재 활성화된 환경 확인
            CURRENT_ENV=$(curl -s http://localhost/active-environment)
            echo "Current environment: $CURRENT_ENV"

            # 다음 활성화 환경 설정
            if [ "$CURRENT_ENV" == "green" ]; then
              NEW_ENV="blue"
            else
              NEW_ENV="green"
            fi

            # 새로운 Docker 이미지 배포
            echo "Deploying new environment: $NEW_ENV"
            docker-compose pull $NEW_ENV nginx
            docker-compose up -d $NEW_ENV nginx

            # Health Check
            echo "Performing health check for $NEW_ENV"
            MAX_RETRIES=10
            RETRY_COUNT=0
            until [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/tig/health)" == "200" ]; do
              echo "Waiting for $NEW_ENV environment to be healthy..."
              sleep 5
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
                echo "Health check for $NEW_ENV environment failed after $MAX_RETRIES retries."
                exit 1
              fi
            done
            echo "$NEW_ENV environment is healthy."

            # Nginx 설정 업데이트
            echo "Updating Nginx to route traffic to $NEW_ENV"
            sed -i "s/\$environment .*/\$environment \"$NEW_ENV\";/" /home/ubuntu/nginx.conf

            # Nginx 설정 검증
            docker cp /home/ubuntu/nginx.conf nginx:/etc/nginx/nginx.conf
            docker exec nginx nginx -t
            if [ $? -ne 0 ]; then
              echo "Nginx configuration test failed. Reverting changes..."
              sed -i "s/\$environment .*/\$environment \"$CURRENT_ENV\";/" /home/ubuntu/nginx.conf
              exit 1
            fi

            # Nginx 재적용
            echo "Reloading Nginx..."
            docker exec nginx nginx -s reload

            # 이전 환경 정리
            echo "Cleaning up $CURRENT_ENV environment"
            docker-compose stop $CURRENT_ENV
            docker-compose rm -f $CURRENT_ENV
            docker rmi nimikgnoej/tig-web:$CURRENT_ENV || true
            echo "Deployment completed. Active environment: $NEW_ENV"