name: CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Java 버전 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 소스 코드 체크아웃
      - name: Checkout code
        uses: actions/checkout@v2

      # Gradle 빌드 실행
      - name: Build with Gradle
        working-directory: server
        run: ./gradlew clean build

      # Docker Compose 설치
      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version

      # Docker 로그인
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # Docker 이미지 빌드 및 푸시
      - name: Build and push Docker images
        run: |
          docker-compose build
          docker push nimikgnoej/tig-web:blue
          docker push nimikgnoej/tig-web:green
          docker push nimikgnoej/tig-nginx

      # Docker 이미지 정리
      - name: Clean up local Docker images
        run: |
          docker images -q | xargs docker rmi --force || true

      # Nginx 컨테이너와 이미지 정리
      - name: Remove old Nginx container and image
        run: |
          docker ps -a -q --filter "name=nginx" | xargs docker rm --force || true
          docker images --filter=reference="nimikgnoej/tig-nginx:latest" -q | xargs docker rmi --force || true

      # Nginx 설정 전송
      - name: Copy Nginx configuration
        run: scp -i tig-key-pair.pem ${{ github.workspace }}/nginx/nginx.conf ubuntu@${{ secrets.SERVER_IP }}:/home/ubuntu/nginx.conf

      # 배포 스크립트 실행
      - name: SSH to EC2 and deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            IS_GREEN=$(docker ps | grep green)
            if [ -z "$IS_GREEN" ]; then
              echo "Switching from BLUE to GREEN"
              docker-compose pull green
              docker-compose up -d green
              until [ "$(curl -s -o /dev/null -w '%{http_code}' https://api.tigleisure.com/tig/health)" == "200" ]; do
                echo "Waiting for BLUE environment to be healthy..."
                sleep 5
              done
              docker exec nginx nginx -s reload
              docker-compose stop blue
              docker-compose rm -f blue
            else
              echo "Switching from GREEN to BLUE"
              docker-compose pull blue
              docker-compose up -d blue
              until [ "$(curl -s -o /dev/null -w '%{http_code}' https://api.tigleisure.com/tig/health)" == "200" ]; do
                echo "Waiting for BLUE environment to be healthy..."
                sleep 5
              done
              docker exec nginx nginx -s reload
              docker-compose stop green
              docker-compose rm -f green
            fi