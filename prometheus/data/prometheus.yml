global:
  scrape_interval: 15s       # 기본 스크랩 주기
  evaluation_interval: 15s   # 룰 평가 주기 (알림 룰 등을 사용할 때 유효)

scrape_configs:
  - job_name: 'app-blue'
    metrics_path: '/tig/prometheus'
    static_configs:
      - targets: ['app-blue:8080']  # Docker Compose 상의 컨테이너 이름과 포트

  - job_name: 'app-green'
    metrics_path: '/tig/prometheus'
    static_configs:
      - targets: ['app-green:8080']