version: '3.8'
services:
  blue:
    build:
      context: .
      dockerfile: Dockerfile
    image: nimikgnoej/tig-web:blue # 블루 환경용 이미지 태그
    ports:
      - "8081:8080" # 블루 환경 포트
    env_file:
      - .env
    container_name: app_blue

  green:
    build:
      context: .
      dockerfile: Dockerfile
    image: nimikgnoej/tig-web:green # 그린 환경용 이미지 태그
    ports:
      - "8082:8080" # 그린 환경 포트
    env_file:
      - .env
    container_name: app_green

#  web:
#    image: nimikgnoej/tig-web:latest
#    build:
#      context: .
#      dockerfile: Dockerfile
#    ports:
#      - "8080:8080" # 내부적으로는 8080 사용
#    env_file:
#      - .env
#    container_name: app

  nginx:
    image: nimikgnoej/tig-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile # nginx에 대한 Dockerfile
    ports:
      - "80:80" # 외부로 노출되는 포트
    depends_on:
      - blue
      - green
    container_name: nginx